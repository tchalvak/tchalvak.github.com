name: PR Website Screenshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "dist/**"
      - "i/**"
      - "favicon.ico"
      - "tersh/**"
      - "x/**"
      - "n/**"
      - "e/**"

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Start local server for PR branch
        run: |
          mkdir -p artifacts
          npx http-server . -p 8000 -c-1 > /tmp/pr-server.log 2>&1 &
          sleep 5

      - name: Capture PR screenshot
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 1400 } });
            await page.goto('http://localhost:8000/index.html', { waitUntil: 'networkidle', timeout: 60000 });
            await page.screenshot({ path: 'artifacts/pr-index.png', fullPage: true });
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Fetch base branch copy
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git worktree add ../base-branch origin/${{ github.event.pull_request.base.ref }}

      - name: Start local server for base branch
        run: |
          cd ../base-branch
          npx http-server . -p 8001 -c-1 > /tmp/base-server.log 2>&1 &
          sleep 5

      - name: Capture base screenshot
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 1400 } });
            await page.goto('http://localhost:8001/index.html', { waitUntil: 'networkidle', timeout: 60000 });
            await page.screenshot({ path: 'artifacts/base-index.png', fullPage: true });
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: |
            artifacts/pr-index.png
            artifacts/base-index.png

      - name: Set release tag
        id: release_tag
        run: echo "tag=pr-screenshot-${{ github.event.pull_request.number }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Publish screenshots to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: PR Screenshot Preview
          files: |
            artifacts/pr-index.png
            artifacts/base-index.png
          draft: false
          prerelease: true

      - name: Comment on PR with embedded screenshot images
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = '${{ steps.release_tag.outputs.tag }}';
            const prUrl = `https://github.com/${owner}/${repo}/releases/download/${tag}/pr-index.png`;
            const baseUrl = `https://github.com/${owner}/${repo}/releases/download/${tag}/base-index.png`;

            const body = `
            ## 📸 Homepage screenshot comparison

            | PR branch | Base branch |
            | --- | --- |
            | ![PR branch](${prUrl}) | ![Base branch](${baseUrl}) |

            Download the full-size screenshots from the release linked in the workflow run.
            `;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body
            });

      - name: Cleanup
        if: always()
        run: |
          pkill -f "http-server" || true